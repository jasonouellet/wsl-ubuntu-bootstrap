---
# =========================================
# Global Variables for DevOps Bootstrap
# =========================================

# System
ansible_become: true
ansible_become_method: sudo

# Configure sudo NOPASSWD (recommended for WSL/dev environments)
# Change to 'no' if you want to disable automatic sudo configuration
common_configure_nopasswd_sudo: true

# Distribution info
distro_codename: "{{ ansible_facts[\"lsb\"][\"codename\"] | default('focal') }}"

# Control whether roles can configure external package repositories
# (Microsoft, HashiCorp, GitHub, NodeSource, Aqua Security, etc.)
enable_external_repositories: true

# =========================================
# Common / Base System Packages
# =========================================
# Base packages for all distributions
common_packages_linux_base:
  # Editors & Shells
  - vim
  - vim-doc
  - vim-scripts
  # System & Repository Management
  - lsb-release                    # Linux Standard Base and distribution information
  - apt-transport-https            # HTTPS support for APT package manager
  - ca-certificates                # SSL/TLS certificate authorities
  # Development Tools
  - git                            # Version control system
  # Networking & Download
  - curl                           # HTTP client for downloading files and APIs
  - wget                           # Download files from the web
  # Security & Encryption
  - gnupg                          # GPG encryption and digital signatures
  - pinentry-gtk2                  # GTK+ PIN entry dialog for GnuPG
  # Archives & Data Processing
  - zip                            # Create compressed ZIP archives
  - unzip                          # Decompress ZIP archives
  - jq                             # Command-line JSON processor
  # Python & CLI Tools
  - pipx                           # Install Python CLI applications in isolation
  # Linting & Validation Tools
  - shellcheck                     # Shell script static analysis and linting

# Debian-specific base packages
common_packages_linux_debian: []

# Alias used by role/task composition and custom overrides
common_packages_linux_common: "{{ common_packages_linux_base }}"

# Ubuntu-specific packages
common_packages_linux_ubuntu:
  - software-properties-common     # Manage software repositories and PPAs (Ubuntu only)

# Combined list for all systems (handled conditionally in tasks)
common_packages_linux: >-
  {{
    common_packages_linux_base
    + (common_packages_linux_ubuntu if ansible_facts['distribution'] == 'Ubuntu' else [])
  }}

# =========================================
# Python Configuration
# =========================================
python_packages_apt:
  # Pyton 3 and development tools
  - python3-full           # Complete Python 3 environment with development files
  - python3-pip            # Package installer for Python
  - python3-setuptools     # Python package development tools
  - python3-virtualenv     # Isolated Python environments

python_tools_pipx:
  # Code Quality & Linting
  - black                  # Python code formatter
  - pylint                 # Python code analyzer
  - pre-commit             # Git hooks framework for code quality
  - yamllint               # YAML linter
  - ansible-core           # Ansible core (required for ansible-lint)
  - ansible-lint           # Ansible playbook and role linting (same version as CI)

python_packages_pip:
  # Documentation Tools
  - mkdocs                             # Static site generator for documentation
  - mkdocs-material                    # Material design theme for MkDocs
  - mkdocs-techdocs-core               # TechDocs core plugins for Backstage
  - mkdocs-macros-plugin               # Macro support in Markdown
  - mkdocs-include-markdown-plugin     # Include external Markdown files
  - mkdocs-redirects                   # Redirect support for moved pages
  - mkdocs-monorepo-plugin             # Multi-repository support
  - plantuml-markdown                  # PlantUML diagram support
  - markdown-graphviz-inline           # Inline Graphviz diagrams in Markdown

# =========================================
# OCI / Container Tools
# =========================================
container_packages:
  - buildah                # Build OCI images without requiring a running daemon
  - skopeo                 # Inspect and copy container images

# =========================================
# Security Scanning Tools
# =========================================
security_scanning_packages:
  - trivy                  # Vulnerability and secret scanner (installed from APT repository)

syft_installer_url: https://get.anchore.io/syft
trivy_apt_key: https://aquasecurity.github.io/trivy-repo/deb/public.key

# =========================================
# Hashicorp Tools
# =========================================
hashicorp_packages:
  # Infrastructure as Code
  - terraform              # Infrastructure provisioning and management
  - packer                 # Machine image builder
  # Security & Secrets
  - vault                  # Secrets management and encryption
  # Service Mesh & Networking
  - consul                 # Service mesh and service discovery
  - boundary               # Secure remote access to infrastructure
  # Orchestration
  - nomad                  # Flexible workload scheduler and orchestrator

hashicorp_apt_key: https://apt.releases.hashicorp.com/gpg
hashicorp_apt_repo_url: "https://apt.releases.hashicorp.com"
# Hashicorp repo may lag new Ubuntu codenames; map to a supported fallback.
hashicorp_repo_codename: "{{ 'jammy' if distro_codename in ['noble'] else distro_codename }}"

# =========================================
# .NET SDK Configuration
# =========================================
# .NET is available in Ubuntu 24.04 official repositories
# https://learn.microsoft.com/en-us/dotnet/core/install/linux-ubuntu-install
dotnet_packages:
  - dotnet-sdk-8.0         # .NET 8 SDK for development and compilation

dotnet_apt_key: https://packages.microsoft.com/keys/microsoft.asc
dotnet_apt_repo_base: https://packages.microsoft.com

dotnet_debian_13_dependencies:
  - libicu76
  - libc6
  - libgcc-s1
  - libgssapi-krb5-2
  - libssl3t64
  - libstdc++6
  - zlib1g

# =========================================
# Node.js Configuration
# =========================================
nodejs_version: "22"  # LTS version
nodejs_setup_script_url: "https://deb.nodesource.com/setup_{{ nodejs_version }}.x"
nodejs_setup_script_dest: /tmp/node-setup.x
nodejs_setup_script_options: "--yes"  # Automatic yes to prompts

nodejs_packages:
  - build-essential        # Essential packages for compiling C/C++ from source
  - gcc                    # GNU C compiler
  - g++                    # GNU C++ compiler
  - make                   # Build automation tool

nodejs_global_npm_packages:
  - markdownlint-cli2      # Markdown linting CLI tool (v2 - latest)

# =========================================
# Azure CLI Configuration
# =========================================
azure_cli_apt_key: https://packages.microsoft.com/keys/microsoft.asc
azure_cli_apt_repo_base: https://packages.microsoft.com/repos/azure-cli/

# =========================================
# GitHub CLI Configuration
# =========================================
github_cli_apt_key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
github_cli_apt_repo: >-
  deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
  https://cli.github.com/packages stable main

# =========================================
# SSL/TLS Configuration
# =========================================
ssl_openssl_config_path: /etc/ssl/openssl.cnf
ssl_ca_cert_path: /usr/local/share/ca-certificates
# Organization CA certificate filename (optional)
# Set this variable to your organization's CA certificate filename
# Example: ssl_ca_cert_name: company-root-ca.crt
# Leave empty or undefined to skip certificate installation
ssl_ca_cert_name: ""
ssl_ca_cert_full_path: "{{ ssl_ca_cert_path }}/{{ ssl_ca_cert_name }}"
ssl_ca_cert_pem_path: "/etc/ssl/certs/{{ ssl_ca_cert_name }}"

# =========================================
# Kubernetes CLI Tools Configuration
# =========================================

# kubectl - Kubernetes CLI (via pkgs.k8s.io APT repository)
k8s_kubectl_version: "1.32"
k8s_kubectl_apt_key: >-
  https://pkgs.k8s.io/core:/stable:/v{{ k8s_kubectl_version }}/deb/Release.key
k8s_kubectl_apt_repo_url: >-
  https://pkgs.k8s.io/core:/stable:/v{{ k8s_kubectl_version }}/deb/

# helm - Kubernetes package manager (via APT repository hosted by Buildkite)
# Reference: https://helm.sh/docs/intro/install/
k8s_helm_apt_key: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
k8s_helm_apt_repo_url: "https://packages.buildkite.com/helm-linux/helm-debian/any/"

# istioctl - Istio service mesh CLI (binary from GitHub releases)
k8s_istio_version: "1.24.3"
k8s_istioctl_download_url: >-
  {{ 'https://github.com/istio/istio/releases/download/' ~ k8s_istio_version ~
  '/istioctl-' ~ k8s_istio_version ~ '-linux-amd64.tar.gz' }}

# calicoctl - Calico CNI CLI (binary from GitHub releases)
k8s_calico_version: "3.29.3"
k8s_calicoctl_download_url: >-
  https://github.com/projectcalico/calico/releases/download/v{{ k8s_calico_version }}/calicoctl-linux-amd64

# k9s - TUI Kubernetes cluster navigator (binary from GitHub releases)
k8s_k9s_version: "0.32.7"
k8s_k9s_download_url: >-
  https://github.com/derailed/k9s/releases/download/v{{ k8s_k9s_version }}/k9s_Linux_amd64.tar.gz

# kubectx / kubens - Context and namespace switcher (binaries from GitHub releases)
k8s_kubectx_version: "0.9.5"
k8s_kubectx_download_url: >-
  https://github.com/ahmetb/kubectx/releases/download/v{{ k8s_kubectx_version }}/kubectx
k8s_kubens_download_url: >-
  https://github.com/ahmetb/kubectx/releases/download/v{{ k8s_kubectx_version }}/kubens

# argocd - ArgoCD GitOps CLI (binary from GitHub releases)
k8s_argocd_version: "2.14.9"
k8s_argocd_download_url: >-
  https://github.com/argoproj/argo-cd/releases/download/v{{ k8s_argocd_version }}/argocd-linux-amd64

# kind - Kubernetes IN Docker (binary from GitHub releases)
k8s_kind_version: "0.27.0"
k8s_kind_download_url: >-
  https://github.com/kubernetes-sigs/kind/releases/download/v{{ k8s_kind_version }}/kind-linux-amd64

# kustomize - Kubernetes configuration manager (binary from GitHub releases)
k8s_kustomize_version: "5.6.0"
k8s_kustomize_download_url: >-
  {{
  'https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv'
  ~ k8s_kustomize_version ~ '/kustomize_v' ~ k8s_kustomize_version ~
  '_linux_amd64.tar.gz' }}

# kubescape - Kubernetes security scanner [OPTIONAL] (binary from GitHub releases)
k8s_kubescape_version: "3.0.21"
k8s_kubescape_download_url: >-
  https://github.com/kubescape/kubescape/releases/download/v{{ k8s_kubescape_version }}/kubescape-ubuntu-latest

# falcoctl - Falco runtime security CLI [OPTIONAL] (binary from GitHub releases)
k8s_falco_version: "0.11.0"
k8s_falcoctl_download_url: >-
  {{ 'https://github.com/falcosecurity/falcoctl/releases/download/v' ~
  k8s_falco_version ~ '/falcoctl_' ~ k8s_falco_version ~
  '_linux_amd64.tar.gz' }}

# cilium - Cilium CNI CLI [OPTIONAL] (binary from GitHub releases)
k8s_cilium_version: "0.16.24"
k8s_cilium_download_url: >-
  https://github.com/cilium/cilium-cli/releases/download/v{{ k8s_cilium_version }}/cilium-linux-amd64.tar.gz

# =========================================
# Maintenance Configuration
# =========================================
maintenance_enable_auto_update: true
maintenance_show_warning: true

# =========================================
# Features Flags (enable/disable components)
# =========================================
enable_common: true
enable_python: true
enable_containers: true
security_enable: true
enable_ssl_config: true
enable_terraform: true
enable_dotnet: true
enable_nodejs: true
enable_azure_cli: true
enable_github_cli: true
enable_k8s: true
# Optional k8s tools (disabled by default - enable in custom.yml as needed)
enable_k8s_kubescape: false     # Kubernetes security & compliance scanner
enable_k8s_falcoctl: false      # Falco runtime threat detection CLI
enable_k8s_cilium: false        # Cilium eBPF networking CLI
enable_maintenance: true
