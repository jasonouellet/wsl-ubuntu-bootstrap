---
# =========================================
# WSL Bootstrap - Main Playbook
# =========================================
# This playbook sets up a complete WSL
# environment with all necessary tools
# including:
# - Base system packages
# - Python & pip packages
# - Container tools (OCI)
# - Security scanning (Trivy, Syft, detect-secrets)
# - Terraform & Hashicorp tools
# - .NET SDK
# - Node.js
# - Azure CLI
# - SSL/TLS configuration
#
# Usage:
#   ansible-playbook main.yml
#   ansible-playbook main.yml --tags nodejs
#   ansible-playbook main.yml --check

- name: WSL Bootstrap Playbook
  hosts: localhost
  connection: local
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Display playbook information
      ansible.builtin.debug:
        msg:
          - "WSL Bootstrapping Playbook"
          - "======================="
          - "Target: {{ inventory_hostname }}"
          - "OS: {{ ansible_facts[\"os_family\"] }}"
          - "Distro: {{ ansible_facts[\"lsb\"][\"description\"] | default('Unknown') }}"
          - "External repositories enabled: {{ enable_external_repositories | default(true) }}"
      tags:
        - always

    # ==========================================
    # SSL Certificate Pre-requisites
    # ==========================================
    - name: Build candidate CA certificate source paths
      ansible.builtin.set_fact:
        playbook_ssl_cert_source_candidates:
          - "{{ ssl_ca_cert_name }}"
          - "{{ playbook_dir }}/{{ ssl_ca_cert_name }}"
          - "{{ ssl_ca_cert_path }}/{{ ssl_ca_cert_name }}"
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

    - name: Check candidate CA certificate source paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ playbook_ssl_cert_source_candidates }}"
      register: playbook_ssl_cert_stats
      become: false
      changed_when: false
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

    - name: Resolve CA certificate source path
      ansible.builtin.set_fact:
        playbook_ssl_cert_source_path: >-
          {{
            (
              playbook_ssl_cert_stats.results
              | selectattr('stat.exists')
              | map(attribute='stat.path')
              | list
              | first
            )
            | default('')
          }}
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

    - name: Display CA certificate setup information
      ansible.builtin.debug:
        msg:
          - "CA Certificate Setup:"
          - "  Configured: {{ ssl_ca_cert_name if ssl_ca_cert_name else 'Not configured' }}"
          - "  File exists: {{ playbook_ssl_cert_source_path != '' }}"
          - "  Resolved source: {{ playbook_ssl_cert_source_path if playbook_ssl_cert_source_path != '' else 'Not found' }}"
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

  roles:
    # Base system setup (always required - other roles depend on this)
    - name: common
      tags: common

    # SSL/TLS configuration
    - name: ssl-config
      tags: ssl-config
      when: enable_ssl_config

    # Programming languages & runtimes
    - name: python
      tags: python
      when: enable_python

    - name: nodejs
      tags: nodejs
      when: enable_nodejs

    - name: dotnet
      tags: dotnet
      when: enable_dotnet

    # Infrastructure as Code & DevOps tools
    - name: terraform
      tags: terraform
      when: enable_terraform

    - name: azure-cli
      tags: azure-cli
      when: enable_azure_cli

    - name: github
      tags: github
      when: enable_github_cli

    # Container tools
    - name: containers
      tags: containers
      when: enable_containers

    # Security scanning tools
    - name: security
      tags: security
      when: security_enable

    # System maintenance
    - name: maintenance
      tags: maintenance
      when: enable_maintenance

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "==========================================="
          - "WSL Bootstrapping Completed Successfully!"
          - "==========================================="
      tags:
        - always

    - name: Suggest next steps
      ansible.builtin.debug:
        msg:
          - ""
          - "Next steps:"
          - "1. Configure git: git config --global user.email 'you@example.com'"
          - "2. Authenticate with Azure: az login"
          - "3. Authenticate with GitHub: gh auth login"
          - ""
          - "Note: Terraform version and Azure CLI version were already verified above."
      tags:
        - always
