---
# =========================================
# WSL Bootstrap - Main Playbook
# =========================================
# This playbook sets up a complete WSL
# environment with all necessary tools
# including:
# - Base system packages
# - Python & pip packages
# - Container tools (OCI)
# - Security scanning (Trivy, Syft, detect-secrets)
# - Terraform & Hashicorp tools
# - .NET SDK
# - Node.js
# - Azure CLI
# - SSL/TLS configuration
#
# Usage:
#   ansible-playbook main.yml
#   ansible-playbook main.yml --tags nodejs
#   ansible-playbook main.yml --check

- name: WSL Bootstrap Playbook
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display playbook information
      ansible.builtin.debug:
        msg:
          - "WSL Bootstrapping Playbook"
          - "======================="
          - "Target: {{ inventory_hostname }}"
          - "OS: {{ ansible_facts[\"os_family\"] }}"
          - "Distro: {{ ansible_facts[\"lsb\"][\"description\"] | default('Unknown') }}"
          - "External repositories enabled: {{ enable_external_repositories | default(true) }}"
      tags:
        - always

    # ==========================================
    # SSL Certificate Pre-requisites
    # ==========================================
    - name: Build candidate CA certificate source paths
      ansible.builtin.set_fact:
        playbook_ssl_cert_source_candidates:
          - "{{ ssl_ca_cert_name }}"
          - "{{ playbook_dir }}/{{ ssl_ca_cert_name }}"
          - "{{ ssl_ca_cert_path }}/{{ ssl_ca_cert_name }}"
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

    - name: Check candidate CA certificate source paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ playbook_ssl_cert_source_candidates }}"
      register: playbook_ssl_cert_stats
      become: false
      changed_when: false
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

    - name: Resolve CA certificate source path
      ansible.builtin.set_fact:
        playbook_ssl_cert_source_path: >-
          {{
            (
              playbook_ssl_cert_stats.results
              | selectattr('stat.exists')
              | map(attribute='stat.path')
              | list
              | first
            )
            | default('')
          }}
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

    - name: Display CA certificate setup information
      ansible.builtin.debug:
        msg:
          - "CA Certificate Setup:"
          - "  Configured: {{ ssl_ca_cert_name if ssl_ca_cert_name else 'Not configured' }}"
          - "  File exists: {{ playbook_ssl_cert_source_path != '' }}"
          - >-
            Resolved source:
            {{ playbook_ssl_cert_source_path if playbook_ssl_cert_source_path != '' else 'Not found' }}
      when: ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
      tags:
        - always
        - ssl-config

    # ==========================================
    # Bootstrap CA certificate BEFORE apt update
    # ==========================================
    # The CA cert must be trusted before apt can reach HTTPS repositories
    # (e.g. JFrog Artifactory). Installing it here, in pre_tasks, guarantees
    # it is available when the common role runs apt update.
    # The ssl-config role still runs later for OpenSSL config & connectivity tests.
    - name: Create CA certificate directory (bootstrap)
      ansible.builtin.file:
        path: "{{ ssl_ca_cert_path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
        - enable_ssl_config | default(true)
        - playbook_ssl_cert_source_path is defined
        - playbook_ssl_cert_source_path != ''
      tags:
        - always
        - ssl-config

    - name: Install CA certificate early (bootstrap, before apt update)
      ansible.builtin.copy:
        src: "{{ playbook_ssl_cert_source_path }}"
        dest: "{{ ssl_ca_cert_full_path }}"
        owner: root
        group: root
        mode: '0644'
      register: bootstrap_cert_installed
      when:
        - ssl_ca_cert_name is defined and ssl_ca_cert_name != ''
        - enable_ssl_config | default(true)
        - playbook_ssl_cert_source_path is defined
        - playbook_ssl_cert_source_path != ''
      tags:
        - always
        - ssl-config

    - name: Update CA certificates immediately (bootstrap)
      ansible.builtin.command: update-ca-certificates --fresh
      changed_when: true
      when:
        - bootstrap_cert_installed is changed
      tags:
        - always
        - ssl-config

  roles:
    # Base system setup (always required - other roles depend on this)
    - name: common
      tags: common

    # SSL/TLS configuration
    - name: ssl-config
      tags: ssl-config
      when: enable_ssl_config

    # Programming languages & runtimes
    - name: python
      tags: python
      when: enable_python

    - name: nodejs
      tags: nodejs
      when: enable_nodejs

    - name: dotnet
      tags: dotnet
      when: enable_dotnet

    # Infrastructure as Code & DevOps tools
    - name: terraform
      tags: terraform
      when: enable_terraform

    - name: azure-cli
      tags: azure-cli
      when: enable_azure_cli

    - name: github
      tags: github
      when: enable_github_cli

    # Container tools
    - name: containers
      tags: containers
      when: enable_containers

    # Security scanning tools
    - name: security
      tags: security
      when: security_enable

    # System maintenance
    - name: maintenance
      tags: maintenance
      when: enable_maintenance

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "==========================================="
          - "WSL Bootstrapping Completed Successfully!"
          - "==========================================="
      tags:
        - always

    - name: Check GitHub CLI authentication status
      ansible.builtin.command: gh auth status --hostname github.com
      register: github_auth_status
      changed_when: false
      failed_when: false
      become: false
      environment:
        HOME: "{{ lookup('env', 'HOME') }}"
        XDG_CONFIG_HOME: "{{ lookup('env', 'HOME') }}/.config"
      when: enable_github_cli | default(true)
      tags:
        - always
        - github

    - name: Suggest next steps (GitHub auth required)
      ansible.builtin.debug:
        msg:
          - ""
          - "Next steps:"
          - "1. Configure git: git config --global user.email 'you@example.com'"
          - "2. Authenticate with Azure: az login"
          - "3. Authenticate with GitHub: gh auth login"
          - ""
          - "Note: Terraform version and Azure CLI version were already verified above."
      when:
        - not (enable_github_cli | default(true))
          or (github_auth_status.rc is not defined)
          or (github_auth_status.rc != 0)
      tags:
        - always

    - name: Suggest next steps (GitHub auth already configured)
      ansible.builtin.debug:
        msg:
          - ""
          - "Next steps:"
          - "1. Configure git: git config --global user.email 'you@example.com'"
          - "2. Authenticate with Azure: az login"
          - "3. GitHub CLI is already authenticated"
          - ""
          - "Note: Terraform version and Azure CLI version were already verified above."
      when:
        - enable_github_cli | default(true)
        - github_auth_status.rc is defined
        - github_auth_status.rc == 0
      tags:
        - always
