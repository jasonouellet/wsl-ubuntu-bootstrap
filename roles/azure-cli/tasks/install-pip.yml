---
# =========================================
# Azure CLI Installation for Debian 13 (Trixie)
# =========================================
# Microsoft does not provide APT repository for Debian 13 yet
# Using pip installation method as recommended by Microsoft
# Reference:
# https://learn.microsoft.com/en-us/cli/azure/install-azure-cli-linux
# ?view=azure-cli-latest&pivots=pip

- name: Display Debian 13 installation method
  ansible.builtin.debug:
    msg:
      - "INFO: Azure CLI installation via pipx is selected"
      - "Reason: Debian 13 is detected or external APT repositories are disabled"
      - "Using pipx installation method instead (recommended by Microsoft for non-supported distributions)"
      - "Reference:"
      - "https://learn.microsoft.com/en-us/cli/azure/install-azure-cli-linux?view=azure-cli-latest&pivots=pip"
  tags:
    - azure-cli
    - packages

- name: Install Azure CLI dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - pipx
      - libffi-dev
      - python3-dev
      - build-essential
    state: present
    update_cache: true
  tags:
    - azure-cli
    - packages

- name: Get current user for pipx installation
  ansible.builtin.set_fact:
    azure_cli_user: "{{ ansible_facts['env'].get('SUDO_USER') or
      ansible_facts['env'].get('USER', ansible_facts['user_id']) }}"
  become: false
  tags:
    - azure-cli
    - packages

- name: Get home directory for azure_cli_user
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ azure_cli_user }}"
  register: azure_cli_user_passwd
  changed_when: false
  failed_when: azure_cli_user_passwd.rc != 0 or (azure_cli_user_passwd.stdout | trim == "")
  become: false
  tags:
    - azure-cli
    - packages

- name: Extract home directory for azure_cli_user
  ansible.builtin.set_fact:
    azure_cli_user_home: "{{ azure_cli_user_passwd.stdout.split(':')[5] | trim }}"
  tags:
    - azure-cli
    - packages

- name: Ensure Azure CLI is installed via pipx for current user
  ansible.builtin.command: pipx install azure-cli
  become: true
  become_user: "{{ azure_cli_user }}"
  changed_when: false
  tags:
    - azure-cli
    - packages

- name: Upgrade Azure CLI via pipx for current user
  ansible.builtin.command: pipx upgrade azure-cli
  become: true
  become_user: "{{ azure_cli_user }}"
  changed_when: false
  tags:
    - azure-cli
    - packages

- name: Create symlink for az command in global bin
  ansible.builtin.file:
    src: "{{ azure_cli_user_home }}/.local/bin/az"
    dest: /usr/local/bin/az
    state: link
    force: true
  tags:
    - azure-cli
    - packages
