---
# ==========================================
# .NET SDK Installation - Main Orchestrator
# ==========================================
# This role installs .NET SDK 8.0 using different methods
# depending on the Linux distribution:
#
# - Debian 13 (Trixie): Official Microsoft installation script
# - Debian 12 (Bookworm) & Ubuntu: Microsoft APT repository
#
# Reference: https://learn.microsoft.com/en-us/dotnet/core/install/linux-debian
#            https://learn.microsoft.com/en-us/dotnet/core/install/linux-ubuntu-install

- name: Get distribution codename
  ansible.builtin.command: lsb_release -cs
  register: dotnet_distro_codename_result
  changed_when: false
  check_mode: false
  tags:
    - dotnet
    - always

# ==========================================
# Installation Methods by Distribution
# ==========================================
- name: Install .NET SDK for Debian 13 (script method)
  ansible.builtin.include_tasks: install-debian-13.yml
  when:
    - ansible_facts['distribution'] == 'Debian'
    - dotnet_distro_codename_result.stdout == 'trixie'
  tags:
    - dotnet
    - packages

- name: Install .NET SDK for Debian 12/Ubuntu (APT repository)
  ansible.builtin.include_tasks: install-apt-repo.yml
  when:
    - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    - not (ansible_facts['distribution'] == 'Debian' and dotnet_distro_codename_result.stdout == 'trixie')
    - enable_external_repositories | default(true)
  tags:
    - dotnet
    - packages

- name: Install .NET SDK from distribution repositories when external repos are disabled
  ansible.builtin.apt:
    name: "{{ dotnet_packages }}"
    state: present
    update_cache: true
  when:
    - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    - not (ansible_facts['distribution'] == 'Debian' and dotnet_distro_codename_result.stdout == 'trixie')
    - not (enable_external_repositories | default(true))
  tags:
    - dotnet
    - packages

# ==========================================
# Verification (all distributions)
# ==========================================
- name: Verify .NET installation
  ansible.builtin.command: dotnet --version
  register: dotnet_version
  changed_when: false
  environment:
    PATH: "/usr/local/dotnet:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  tags:
    - dotnet
    - test

- name: Display .NET version
  ansible.builtin.debug:
    msg: "dotnet SDK version: {{ dotnet_version.stdout }}"
  when: not ansible_check_mode
  tags:
    - dotnet
    - test

- name: Display .NET version skipped in check mode
  ansible.builtin.debug:
    msg: "dotnet version verification skipped in check mode"
  when: ansible_check_mode
  tags:
    - dotnet
    - test
