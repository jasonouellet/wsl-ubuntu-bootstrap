---
# Install GitHub CLI from official repository

- name: Add GitHub CLI GPG key
  ansible.builtin.get_url:
    url: "{{ github_cli_apt_key }}"
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  when:
    - github_enable_cli | bool
    - enable_external_repositories | default(true)
  tags:
    - github
    - packages
    - gpg

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "{{ github_cli_apt_repo }}"
    state: present
    filename: github-cli
  when:
    - github_enable_cli | bool
    - enable_external_repositories | default(true)
  tags:
    - github
    - repository

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  tags:
    - github
    - packages

- name: Verify GitHub CLI installation
  ansible.builtin.command:
    cmd: gh --version
  changed_when: false
  register: github_gh_version
  tags:
    - github
    - test

- name: Display GitHub CLI version
  ansible.builtin.debug:
    msg: "✓ GitHub CLI installed: {{ github_gh_version.stdout }}"
  tags:
    - github
    - test

# Install GitHub Copilot CLI
- name: Fail when GitHub Copilot CLI is enabled but GitHub CLI is disabled
  ansible.builtin.fail:
    msg: >-
      GitHub Copilot CLI installation requires GitHub CLI (gh).
      Set github_enable_cli: true or disable github_enable_copilot_cli.
  when:
    - github_enable_copilot_cli | bool
    - not (github_enable_cli | bool)
  tags:
    - github
    - copilot-cli
    - packages

- name: Get installed GitHub CLI extensions
  ansible.builtin.command:
    cmd: gh extension list
  register: github_gh_extensions
  changed_when: false
  when:
    - github_enable_copilot_cli | bool
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - packages

- name: Install GitHub Copilot CLI extension
  ansible.builtin.command:
    cmd: gh extension install github/gh-copilot
  register: github_copilot_install
  changed_when: github_copilot_install.rc == 0
  when:
    - github_enable_copilot_cli | bool
    - github_enable_cli | bool
    - "'github/gh-copilot' not in (github_gh_extensions.stdout | default(''))"
  tags:
    - github
    - copilot-cli
    - packages

- name: Upgrade GitHub Copilot CLI extension
  ansible.builtin.command:
    cmd: gh extension upgrade github/gh-copilot
  changed_when: false
  failed_when: false
  when:
    - github_enable_copilot_cli | bool
    - github_enable_cli | bool
    - "'github/gh-copilot' in (github_gh_extensions.stdout | default(''))"
  tags:
    - github
    - copilot-cli
    - packages

- name: Verify GitHub Copilot CLI installation
  ansible.builtin.command:
    cmd: gh copilot --version
  changed_when: false
  check_mode: false
  failed_when: false
  register: github_copilot_cli_version
  when:
    - github_enable_copilot_cli | bool
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - test

- name: Display GitHub Copilot CLI version
  ansible.builtin.debug:
    msg: "✓ GitHub Copilot CLI installed: {{ github_copilot_cli_version.stdout | default('(version unavailable)') }}"
  when:
    - github_enable_copilot_cli | bool
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - test
