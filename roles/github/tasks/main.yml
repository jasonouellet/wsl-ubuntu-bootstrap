---
# Install GitHub CLI from official repository

- name: Add GitHub CLI GPG key
  ansible.builtin.get_url:
    url: "{{ github_cli_apt_key }}"
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  tags:
    - github
    - packages
    - gpg

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "{{ github_cli_apt_repo }}"
    state: present
    filename: github-cli
  tags:
    - github
    - repository

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: yes
  tags:
    - github
    - packages

- name: Verify GitHub CLI installation
  ansible.builtin.command:
    cmd: gh --version
  changed_when: false
  register: gh_version
  tags:
    - github
    - test

- name: Display GitHub CLI version
  ansible.builtin.debug:
    msg: "✓ GitHub CLI installed: {{ gh_version.stdout }}"
  tags:
    - github
    - test

# Install GitHub Copilot CLI
- name: Download GitHub Copilot CLI install script
  ansible.builtin.get_url:
    url: https://gh.io/copilot-install
    dest: /tmp/copilot-install.sh
    mode: '0755'
  when: enable_copilot_cli | default(true)
  tags:
    - github
    - copilot-cli
    - packages

- name: Install GitHub Copilot CLI
  ansible.builtin.command:
    cmd: /tmp/copilot-install.sh
    creates: /usr/local/bin/copilot
  environment:
    PREFIX: /usr/local
  when: enable_copilot_cli | default(true)
  tags:
    - github
    - copilot-cli
    - packages

- name: Verify GitHub Copilot CLI installation
  ansible.builtin.command:
    cmd: copilot --version
  changed_when: false
  check_mode: false
  failed_when: false
  register: copilot_cli_version
  when: enable_copilot_cli | default(true)
  tags:
    - github
    - copilot-cli
    - test

- name: Display GitHub Copilot CLI version
  ansible.builtin.debug:
    msg: "✓ GitHub Copilot CLI installed: {{ copilot_cli_version.stdout | default('(version unavailable)') }}"
  when: enable_copilot_cli | default(true)
  tags:
    - github
    - copilot-cli
    - test
