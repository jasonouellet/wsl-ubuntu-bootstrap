---
# Install GitHub CLI from official repository

- name: Add GitHub CLI GPG key
  ansible.builtin.get_url:
    url: "{{ github_cli_apt_key }}"
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  when:
    - github_enable_cli | bool
    - enable_external_repositories | default(true)
  tags:
    - github
    - packages
    - gpg

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "{{ github_cli_apt_repo }}"
    state: present
    filename: github-cli
  when:
    - github_enable_cli | bool
    - enable_external_repositories | default(true)
  tags:
    - github
    - repository

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  tags:
    - github
    - packages

- name: Verify GitHub CLI installation
  ansible.builtin.command:
    cmd: gh --version
  changed_when: false
  register: github_gh_version
  tags:
    - github
    - test

- name: Display GitHub CLI version
  ansible.builtin.debug:
    msg: "✓ GitHub CLI installed: {{ github_gh_version.stdout }}"
  tags:
    - github
    - test

# Install GitHub Copilot CLI
- name: Detect built-in GitHub Copilot command
  ansible.builtin.command:
    cmd: gh copilot --version
  register: github_copilot_builtin
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - test

- name: Check GitHub CLI authentication status
  ansible.builtin.command:
    cmd: gh auth status --hostname github.com
  register: github_auth_status
  changed_when: false
  failed_when: false
  check_mode: false
  become: false
  when:
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - test

- name: Get installed GitHub CLI extensions
  ansible.builtin.command:
    cmd: gh extension list
  register: github_gh_extensions
  changed_when: false
  failed_when: false
  when:
    - github_enable_cli | bool
    - github_copilot_builtin.rc != 0
  tags:
    - github
    - copilot-cli
    - packages

- name: Explain authentication requirement for Copilot extension mode
  ansible.builtin.debug:
    msg:
      - "GitHub Copilot is not built into this gh version."
      - "Authentication is required to install extension github/gh-copilot."
      - "Run: gh auth login"
      - "Then rerun: ansible-playbook main.yml --tags github"
  when:
    - github_enable_cli | bool
    - github_copilot_builtin.rc != 0
    - github_auth_status.rc != 0
  tags:
    - github
    - copilot-cli
    - packages

- name: Install GitHub Copilot CLI extension
  ansible.builtin.command:
    cmd: gh extension install github/gh-copilot
  register: github_copilot_install
  changed_when: github_copilot_install.rc == 0
  failed_when: false
  when:
    - github_enable_cli | bool
    - github_copilot_builtin.rc != 0
    - github_auth_status.rc == 0
    - "'github/gh-copilot' not in (github_gh_extensions.stdout | default(''))"
  tags:
    - github
    - copilot-cli
    - packages

- name: Upgrade GitHub Copilot CLI extension
  ansible.builtin.command:
    cmd: gh extension upgrade github/gh-copilot
  register: github_copilot_upgrade
  changed_when: false
  failed_when: false
  when:
    - github_enable_cli | bool
    - github_copilot_builtin.rc != 0
    - github_auth_status.rc == 0
    - "'github/gh-copilot' in (github_gh_extensions.stdout | default(''))"
  tags:
    - github
    - copilot-cli
    - packages

- name: Verify GitHub Copilot CLI installation
  ansible.builtin.command:
    cmd: gh copilot --version
  changed_when: false
  check_mode: false
  failed_when: false
  register: github_copilot_cli_version
  when:
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - test

- name: Fail if GitHub Copilot CLI is unavailable after installation attempts
  ansible.builtin.fail:
    msg: >-
      GitHub Copilot CLI is not available.
      If your gh version requires the extension, authenticate first with
      'gh auth login' and rerun the github role.
  when:
    - github_enable_cli | bool
    - github_copilot_cli_version.rc != 0
    - github_auth_status.rc == 0 or github_copilot_builtin.rc == 0
  tags:
    - github
    - copilot-cli
    - test

- name: Display GitHub Copilot source mode
  ansible.builtin.debug:
    msg:
      - >-
        GitHub Copilot CLI source:
        {{ 'built-in gh command' if github_copilot_builtin.rc == 0 else 'gh extension github/gh-copilot' }}
      - >-
        Upgrade command: {{ 'sudo apt install --only-upgrade gh (or gh copilot)'
        if github_copilot_builtin.rc == 0 else 'gh extension upgrade github/gh-copilot' }}
  when:
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - test

- name: Display GitHub Copilot CLI version
  ansible.builtin.debug:
    msg: "✓ GitHub Copilot CLI installed: {{ github_copilot_cli_version.stdout | default('(version unavailable)') }}"
  when:
    - github_enable_cli | bool
  tags:
    - github
    - copilot-cli
    - test
