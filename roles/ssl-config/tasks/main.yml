---
- name: Check if CA certificate is provided
  ansible.builtin.set_fact:
    ca_cert_provided: "{{ ssl_ca_cert_name is defined and ssl_ca_cert_name | length > 0 }}"
  tags:
    - ssl-config
    - certificates
    - ssl-verify

- name: Display certificate info
  ansible.builtin.debug:
    msg: "Installing CA certificate: {{ ssl_ca_cert_name }}"
  when: ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Display skipping message
  ansible.builtin.debug:
    msg: "No CA certificate configured (ssl_ca_cert_name is empty). Skipping certificate installation."
  when: not ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Build candidate certificate source paths
  ansible.builtin.set_fact:
    ssl_ca_cert_source_candidates:
      - "{{ ssl_ca_cert_name }}"
      - "{{ playbook_dir }}/{{ ssl_ca_cert_name }}"
      - "{{ ssl_ca_cert_path }}/{{ ssl_ca_cert_name }}"
  when: ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Check candidate certificate source paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ssl_ca_cert_source_candidates }}"
  register: cert_source_stats
  changed_when: false
  when: ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Resolve certificate source path
  ansible.builtin.set_fact:
    ssl_ca_cert_source_path: >-
      {{
        (
          cert_source_stats.results
          | selectattr('stat.exists')
          | map(attribute='stat.path')
          | list
          | first
        )
        | default('')
      }}
  when: ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Fail if certificate file is not found in any supported location
  ansible.builtin.fail:
    msg: >-
      CA certificate file '{{ ssl_ca_cert_name }}' not found.
      Checked: {{ ssl_ca_cert_source_candidates | join(', ') }}
  when: ca_cert_provided and ssl_ca_cert_source_path | length == 0
  tags:
    - ssl-config
    - certificates

- name: Display resolved certificate source path
  ansible.builtin.debug:
    msg: "Using CA certificate source: {{ ssl_ca_cert_source_path }}"
  when: ca_cert_provided and ssl_ca_cert_source_path | length > 0
  tags:
    - ssl-config
    - certificates

- name: Create CA certificate directory
  ansible.builtin.file:
    path: "{{ ssl_ca_cert_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Install IA CA certificate
  ansible.builtin.copy:
    src: "{{ ssl_ca_cert_source_path }}"
    dest: "{{ ssl_ca_cert_full_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Update CA certificates
  when: ca_cert_provided and ssl_ca_cert_source_path | length > 0
  tags:
    - ssl-config
    - certificates

- name: Fix SSL handshake for OpenSSL v3.0.2 - Remove legacy options
  ansible.builtin.replace:
    path: "{{ ssl_openssl_config_path }}"
    after: '^\[system_default_sect\]'
    before: '^\['
    regexp: '^\s*Options\s*=.*$'
    replace: ''
  when: ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Fix SSL handshake for OpenSSL v3.0.2 - Add UnsafeLegacyRenegotiation
  ansible.builtin.lineinfile:
    path: "{{ ssl_openssl_config_path }}"
    insertafter: '^\[system_default_sect\]'
    line: 'Options = UnsafeLegacyRenegotiation'
  when: ca_cert_provided
  tags:
    - ssl-config
    - certificates

- name: Verify OpenSSL configuration
  ansible.builtin.command: openssl version
  register: openssl_version
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - ssl-config
    - test

- name: Display OpenSSL version
  ansible.builtin.debug:
    msg: "OpenSSL version: {{ openssl_version.stdout | default('(check mode)') }}"
  tags:
    - ssl-config
    - test

- name: Verify CA certificate installation
  ansible.builtin.stat:
    path: "{{ ssl_ca_cert_full_path }}"
  register: installed_cert
  when: ca_cert_provided
  tags:
    - ssl-config
    - test

- name: Display certificate installation status
  ansible.builtin.debug:
    msg: "CA certificate installed: {{ installed_cert.stat.exists | default(false) }}"
  when: ca_cert_provided
  tags:
    - ssl-config
    - test

# Verify that the certificate actually works with HTTPS connections
- name: Test HTTPS connectivity with curl
  ansible.builtin.uri:
    url: "{{ ssl_test_url }}"
    method: HEAD
    follow_redirects: all
    status_code:
      - 200
      - 301
      - 302
  register: curl_https_test
  changed_when: false
  when:
    - ca_cert_provided is defined
    - ca_cert_provided
    - ssl_test_connectivity
  tags:
    - ssl-config
    - test
    - ssl-verify

- name: Test HTTPS connectivity with Python
  ansible.builtin.command: >
    python3 -c "import urllib.request; urllib.request.urlopen('{{ ssl_test_url }}').read(1)"
  register: python_https_test
  changed_when: false
  failed_when: python_https_test.rc != 0
  become: false
  when:
    - ca_cert_provided is defined
    - ca_cert_provided
    - ssl_test_connectivity
  tags:
    - ssl-config
    - test
    - ssl-verify

- name: Display HTTPS verification status
  ansible.builtin.debug:
    msg:
      - "✓ curl HTTPS test: Success"
      - "✓ Python HTTPS test: Success"
      - "✓ CA certificate is working correctly"
  when:
    - ca_cert_provided is defined
    - ca_cert_provided
    - curl_https_test.rc is defined and curl_https_test.rc == 0
    - python_https_test.rc is defined and python_https_test.rc == 0
  tags:
    - ssl-config
    - test
    - ssl-verify
