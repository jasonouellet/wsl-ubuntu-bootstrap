---
# =========================================
# kustomize - Kubernetes Configuration Manager (binary)
# Reference: https://kubectl.docs.kubernetes.io/installation/kustomize/
# Checksum Verification: Downloaded from official GitHub release
# =========================================

- name: Download kustomize checksum file from GitHub releases
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/kustomize/releases/download/\
      kustomize/v{{ k8s_kustomize_version }}/checksums.txt"
    dest: /tmp/kustomize-checksums.txt
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - kustomize
    - gpg

- name: Extract kustomize binary hash from GitHub checksums
  ansible.builtin.command: awk '/kustomize_v{{ k8s_kustomize_version }}_linux_amd64.tar.gz$/ {print $1; exit}' /tmp/kustomize-checksums.txt
  register: k8s_kustomize_checksum
  changed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kustomize
    - gpg

- name: Download kustomize archive with checksum verification
  ansible.builtin.get_url:
    url: "{{ k8s_kustomize_download_url }}"
    dest: "/tmp/kustomize_{{ k8s_kustomize_version }}_linux_amd64.tar.gz"
    checksum: "sha256:{{ k8s_kustomize_checksum.stdout | trim }}"
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - kustomize
    - packages

- name: Extract and install kustomize binary
  ansible.builtin.unarchive:
    src: "/tmp/kustomize_{{ k8s_kustomize_version }}_linux_amd64.tar.gz"
    dest: /usr/local/bin/
    remote_src: true
    include:
      - kustomize
    owner: root
    group: root
    mode: '0755'
    creates: /usr/local/bin/kustomize
  when: not ansible_check_mode
  tags:
    - k8s
    - kustomize
    - packages

- name: Verify kustomize installation
  ansible.builtin.command: kustomize version
  register: k8s_kustomize_version_check
  changed_when: false
  become: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kustomize
    - test

- name: Display kustomize version
  ansible.builtin.debug:
    msg: "kustomize installed: {{ k8s_kustomize_version_check.stdout | default('(check mode)') }}"
  when: not ansible_check_mode
  tags:
    - k8s
    - kustomize
