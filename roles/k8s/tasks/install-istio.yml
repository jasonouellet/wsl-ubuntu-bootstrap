---
# =========================================
# istioctl - Istio Service Mesh CLI (binary)
# Reference: https://istio.io/latest/docs/ops/diagnostic-tools/istioctl/
# Checksum Verification: Downloaded from official GitHub release
# =========================================

- name: Download istio checksum file from GitHub releases
  ansible.builtin.get_url:
    url: "https://github.com/istio/istio/releases/download/{{ k8s_istio_version }}/checksums.txt"
    dest: /tmp/istio-checksums.txt
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - istio
    - gpg

- name: Extract istio binary hash from GitHub checksums
  ansible.builtin.shell: |
    set -o pipefail
    grep "istioctl-{{ k8s_istio_version }}-linux-amd64.tar.gz$" /tmp/istio-checksums.txt | awk '{print $1}'
  register: k8s_istio_checksum
  changed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - istio
    - gpg

- name: Download istioctl archive with checksum verification
  ansible.builtin.get_url:
    url: "{{ k8s_istioctl_download_url }}"
    dest: "/tmp/istioctl-{{ k8s_istio_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ k8s_istio_checksum.stdout | trim }}"
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - istio
    - packages

- name: Extract and install istioctl binary
  ansible.builtin.unarchive:
    src: "/tmp/istioctl-{{ k8s_istio_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin/
    remote_src: true
    include:
      - istioctl
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
  args:
    creates: /usr/local/bin/istioctl
  tags:
    - k8s
    - istio
    - packages

- name: Verify istioctl installation
  ansible.builtin.command: istioctl version --remote=false
  register: k8s_istioctl_version_check
  changed_when: false
  become: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - istio
    - test

- name: Display istioctl version
  ansible.builtin.debug:
    msg: "istioctl installed: {{ k8s_istioctl_version_check.stdout | default('(check mode)') }}"
  when: not ansible_check_mode
  tags:
    - k8s
    - istio
