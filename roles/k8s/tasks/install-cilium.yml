---
# =========================================
# cilium - Cilium CNI CLI (binary) [OPTIONAL]
# Reference: https://docs.cilium.io/en/stable/gettingstarted/k8s-install-default/
# Enabled via: k8s_enable_cilium: true
# Checksum Verification: Downloaded from official GitHub release
# =========================================

- name: Download cilium checksum file from GitHub releases
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/v{{ k8s_cilium_version }}/checksums.txt"
    dest: /tmp/cilium-checksums.txt
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - cilium
    - gpg

- name: Extract cilium binary hash from GitHub checksums
  ansible.builtin.command: awk '/cilium-linux-amd64.tar.gz$/ {print $1; exit}' /tmp/cilium-checksums.txt
  register: k8s_cilium_checksum
  changed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - cilium
    - gpg

- name: Download cilium CLI archive with checksum verification
  ansible.builtin.get_url:
    url: "{{ k8s_cilium_download_url }}"
    dest: "/tmp/cilium-linux-amd64.tar.gz"
    checksum: "sha256:{{ k8s_cilium_checksum.stdout | trim }}"
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - cilium
    - packages

- name: Extract and install cilium binary
  ansible.builtin.unarchive:
    src: /tmp/cilium-linux-amd64.tar.gz
    dest: /usr/local/bin/
    remote_src: true
    include:
      - cilium
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
  tags:
    - k8s
    - cilium
    - packages

- name: Verify cilium installation
  ansible.builtin.command: cilium version --client
  register: k8s_cilium_version_check
  changed_when: false
  become: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - cilium
    - test

- name: Display cilium version
  ansible.builtin.debug:
    msg: "cilium installed: {{ k8s_cilium_version_check.stdout | default('(check mode)') }}"
  when: not ansible_check_mode
  tags:
    - k8s
    - cilium
