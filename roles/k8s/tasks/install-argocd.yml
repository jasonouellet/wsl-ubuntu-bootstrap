---
# =========================================
# argocd - ArgoCD GitOps CLI (binary)
# Reference: https://argo-cd.readthedocs.io/en/stable/cli_installation/
# =========================================

- name: Download and install argocd binary
  ansible.builtin.get_url:
    url: "{{ k8s_argocd_download_url }}"
    dest: /usr/local/bin/argocd
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
  tags:
    - k8s
    - argocd
    - packages

- name: Verify argocd installation
  ansible.builtin.command: argocd version --client
  register: k8s_argocd_version_check
  changed_when: false
  become: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - argocd
    - test

- name: Display argocd version
  ansible.builtin.debug:
    msg: "argocd installed: {{ k8s_argocd_version_check.stdout_lines | default(['(check mode)']) }}"
  when: not ansible_check_mode
  tags:
    - k8s
    - argocd
