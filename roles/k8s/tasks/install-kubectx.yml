---
# =========================================
# kubectx + kubens - Context & Namespace Switcher (binaries)
# Reference: https://github.com/ahmetb/kubectx
# Checksum Verification: Downloaded from official GitHub release
# =========================================

- name: Download kubectx checksum file from GitHub releases
  ansible.builtin.get_url:
    url: "https://github.com/ahmetb/kubectx/releases/download/v{{ k8s_kubectx_version }}/checksums.txt"
    dest: /tmp/kubectx.checksums.txt
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - gpg

- name: Extract kubectx binary hash from GitHub checksums
  ansible.builtin.shell: |
    set -o pipefail
    grep "^[a-f0-9]\\{64\\}.*kubectx$" /tmp/kubectx.checksums.txt | awk '{print $1}'
  register: k8s_kubectx_checksum
  changed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - gpg

- name: Extract kubens binary hash from GitHub checksums
  ansible.builtin.shell: |
    set -o pipefail
    grep "^[a-f0-9]\\{64\\}.*kubens$" /tmp/kubectx.checksums.txt | awk '{print $1}'
  register: k8s_kubens_checksum
  changed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - gpg

- name: Download and install kubectx binary with checksum verification
  ansible.builtin.get_url:
    url: "{{ k8s_kubectx_download_url }}"
    dest: /usr/local/bin/kubectx
    checksum: "sha256:{{ k8s_kubectx_checksum.stdout | trim }}"
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Download and install kubens binary with checksum verification
  ansible.builtin.get_url:
    url: "{{ k8s_kubens_download_url }}"
    dest: /usr/local/bin/kubens
    checksum: "sha256:{{ k8s_kubens_checksum.stdout | trim }}"
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Verify kubectx installation
  ansible.builtin.command: kubectx --help
  register: k8s_kubectx_version_check
  changed_when: false
  become: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - test

- name: Display kubectx status
  ansible.builtin.debug:
    msg: "kubectx installed: {{ 'ok' if k8s_kubectx_version_check.rc == 0 else 'failed' }}"
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
