---
# =========================================
# kubectx + kubens - Context & Namespace Switcher (binaries)
# Reference: https://github.com/ahmetb/kubectx
# =========================================

- name: Download and install kubectx binary
  ansible.builtin.get_url:
    url: "{{ k8s_kubectx_download_url }}"
    dest: /usr/local/bin/kubectx
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Download and install kubens binary
  ansible.builtin.get_url:
    url: "{{ k8s_kubens_download_url }}"
    dest: /usr/local/bin/kubens
    owner: root
    group: root
    mode: '0755'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Verify kubectx installation
  ansible.builtin.command: kubectx --help
  register: k8s_kubectx_version_check
  changed_when: false
  become: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - test

- name: Display kubectx status
  ansible.builtin.debug:
    msg: "kubectx installed: {{ 'ok' if k8s_kubectx_version_check.rc == 0 else 'failed' }}"
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
