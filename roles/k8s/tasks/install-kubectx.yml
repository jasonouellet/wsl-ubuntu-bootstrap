---
# =========================================
# kubectx + kubens - Context & Namespace Switcher (binaries)
# Reference: https://github.com/ahmetb/kubectx
# Checksum Verification: Downloaded from official GitHub release
# =========================================

- name: Download kubectx checksum file from GitHub releases
  ansible.builtin.get_url:
    url: "https://github.com/ahmetb/kubectx/releases/download/v{{ k8s_kubectx_version }}/checksums.txt"
    dest: /tmp/kubectx.checksums.txt
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - gpg

- name: Extract kubectx binary hash from GitHub checksums
  ansible.builtin.command:
    argv:
      - awk
      - >-
        $1 ~ /^[0-9a-f]{64}$/ && $2 ~ /^kubectx_v[0-9.]+_linux_x86_64\.tar\.gz$/ { print $1; exit }
      - /tmp/kubectx.checksums.txt
  register: k8s_kubectx_checksum
  changed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - gpg

- name: Extract kubens binary hash from GitHub checksums
  ansible.builtin.command:
    argv:
      - awk
      - >-
        $1 ~ /^[0-9a-f]{64}$/ && $2 ~ /^kubens_v[0-9.]+_linux_x86_64\.tar\.gz$/ { print $1; exit }
      - /tmp/kubectx.checksums.txt
  register: k8s_kubens_checksum
  changed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - gpg

- name: Download kubectx archive with checksum verification
  ansible.builtin.get_url:
    url: "{{ k8s_kubectx_download_url }}"
    dest: "/tmp/kubectx_v{{ k8s_kubectx_version }}_linux_x86_64.tar.gz"
    checksum: "sha256:{{ k8s_kubectx_checksum.stdout | trim }}"
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Download kubens archive with checksum verification
  ansible.builtin.get_url:
    url: "{{ k8s_kubens_download_url }}"
    dest: "/tmp/kubens_v{{ k8s_kubectx_version }}_linux_x86_64.tar.gz"
    checksum: "sha256:{{ k8s_kubens_checksum.stdout | trim }}"
    owner: root
    group: root
    mode: '0600'
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Extract and install kubectx binary
  ansible.builtin.unarchive:
    src: "/tmp/kubectx_v{{ k8s_kubectx_version }}_linux_x86_64.tar.gz"
    dest: /usr/local/bin/
    remote_src: true
    include:
      - kubectx
    owner: root
    group: root
    mode: '0755'
    creates: /usr/local/bin/kubectx
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Extract and install kubens binary
  ansible.builtin.unarchive:
    src: "/tmp/kubens_v{{ k8s_kubectx_version }}_linux_x86_64.tar.gz"
    dest: /usr/local/bin/
    remote_src: true
    include:
      - kubens
    owner: root
    group: root
    mode: '0755'
    creates: /usr/local/bin/kubens
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - packages

- name: Verify kubectx installation
  ansible.builtin.command: kubectx --help
  register: k8s_kubectx_version_check
  changed_when: false
  become: false
  failed_when: false
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
    - test

- name: Display kubectx status
  ansible.builtin.debug:
    msg: "kubectx installed: {{ 'ok' if k8s_kubectx_version_check.rc == 0 else 'failed' }}"
  when: not ansible_check_mode
  tags:
    - k8s
    - kubectx
