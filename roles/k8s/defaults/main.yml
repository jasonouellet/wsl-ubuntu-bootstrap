---
# Kubernetes role configuration
# Enable via enable_k8s flag in group_vars/all.yml

# Optional tools - disabled by default
# Override in group_vars/custom.yml to enable
k8s_enable_kubescape: false   # Kubernetes security & compliance scanner
k8s_enable_falcoctl: false    # Falco runtime threat detection CLI
k8s_enable_cilium: false      # Cilium eBPF networking CLI
