---
- name: Install Python packages (APT)
  ansible.builtin.apt:
    name: "{{ python_packages_apt }}"
    state: present
    update_cache: true
  tags:
    - python
    - packages

- name: Ensure global pipx shared directory exists
  ansible.builtin.file:
    path: /opt/pipx
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - python
    - packages
    - pipx

- name: Get globally installed pipx tools
  ansible.builtin.command: pipx list --short
  register: python_pipx_global_list
  changed_when: false
  failed_when: false
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - python
    - packages
    - pipx

- name: Install Python tools via pipx (global for all users)
  ansible.builtin.command:
    cmd: pipx install "{{ item }}"
    creates: "/opt/pipx/venvs/{{ item }}"
  loop: "{{ python_tools_pipx }}"
  when: item not in (python_pipx_global_list.stdout | default(''))
  register: python_pipx_global_install
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - python
    - packages
    - pipx

- name: Upgrade already installed global pipx tools
  ansible.builtin.command: pipx upgrade "{{ item }}"
  loop: "{{ python_tools_pipx }}"
  when: item in (python_pipx_global_list.stdout | default(''))
  changed_when: false
  failed_when: false
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - python
    - packages
    - pipx

- name: Ensure pipx global binary path is present system-wide
  ansible.builtin.lineinfile:
    path: /etc/profile.d/pipx.sh
    line: 'export PATH="/usr/local/bin:$PATH"'
    create: true
    mode: '0644'
    owner: root
    group: root
  tags:
    - python
    - packages
    - pipx

- name: Install Python packages (PIP in venv)
  ansible.builtin.pip:
    name: "{{ python_packages_pip }}"
    state: present
    virtualenv: /opt/python-venv
    virtualenv_command: python3 -m venv
  tags:
    - python
    - packages

- name: Verify Python installation
  ansible.builtin.command: python3 --version
  register: python_version
  changed_when: false
  tags:
    - python
    - test

- name: Verify pipx PATH configurations exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/profile.d/pipx.sh
  register: python_pipx_path_configs
  tags:
    - python
    - test

- name: Verify pipx tools are accessible
  ansible.builtin.command: which {{ item }}
  loop: "{{ python_tools_pipx }}"
  register: python_pipx_tools
  changed_when: false
  failed_when: false
  tags:
    - python
    - test

- name: Display Python version
  ansible.builtin.debug:
    msg:
      - "Python version: {{ python_version.stdout }}"
      - "pre-commit accessible: {{ python_pipx_tools.results[0].rc == 0 }}"
      - "yamllint accessible: {{ python_pipx_tools.results[1].rc == 0 }}"
      - "pylint accessible: {{ python_pipx_tools.results[2].rc == 0 }}"
      - "black accessible: {{ python_pipx_tools.results[3].rc == 0 }}"
  tags:
    - python
    - test
