---
- name: Install Python packages (APT)
  ansible.builtin.apt:
    name: "{{ python_packages_apt }}"
    state: present
    update_cache: true
  tags:
    - python
    - packages

- name: Check if uv is already installed
  ansible.builtin.command: "{{ python_uv_install_dir }}/uv --version"
  register: python_uv_existing_install
  changed_when: false
  failed_when: false
  become: false
  when: python_enable_uv | bool
  tags:
    - python
    - uv

- name: Download uv installer
  ansible.builtin.get_url:
    url: "{{ python_uv_install_url }}"
    dest: /tmp/uv-install.sh
    mode: "0755"
  become: false
  when:
    - python_enable_uv | bool
    - python_uv_existing_install.rc != 0
  tags:
    - python
    - uv

- name: Install uv for uvx-based MCP servers
  ansible.builtin.command:
    cmd: /tmp/uv-install.sh --no-modify-path
  environment:
    UV_INSTALL_DIR: "{{ python_uv_install_dir }}"
    HOME: "{{ python_uv_user_home }}"
  become: false
  when:
    - python_enable_uv | bool
    - python_uv_existing_install.rc != 0
  register: python_uv_install
  changed_when: true
  tags:
    - python
    - uv

- name: Configure uv PATH in the user shell
  ansible.builtin.lineinfile:
    path: "{{ python_uv_user_home }}/.bashrc"
    line: "export PATH=\"${HOME}/.local/bin:$PATH\"  # uv"
    regexp: "^\\s*export PATH=.*\\.local/bin.*uv"
    create: true
    owner: "{{ python_uv_user }}"
    mode: "0644"
  become: false
  when: python_enable_uv | bool
  tags:
    - python
    - uv

- name: Verify uvx is available
  ansible.builtin.command: "{{ python_uv_install_dir }}/uvx --help"
  changed_when: false
  become: false
  environment:
    HOME: "{{ python_uv_user_home }}"
  when: python_enable_uv | bool
  tags:
    - python
    - uv

- name: Ensure global pipx shared directory exists
  ansible.builtin.file:
    path: /opt/pipx
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - python
    - packages
    - pipx

- name: Get globally installed pipx tools
  ansible.builtin.command: pipx list --short
  register: python_pipx_global_list
  changed_when: false
  failed_when: false
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - python
    - packages
    - pipx

- name: Build exact installed pipx package name list
  ansible.builtin.set_fact:
    python_pipx_installed_names: >-
      {{
        (python_pipx_global_list.stdout_lines | default([]))
        | map('regex_replace', '^\\s*', '')
        | map('regex_replace', '\\s+.*$', '')
        | reject('equalto', '')
        | list
      }}
  tags:
    - python
    - packages
    - pipx

- name: Install Python tools via pipx (global for all users)
  ansible.builtin.command:
    cmd: pipx install "{{ item }}"
    creates: "/opt/pipx/venvs/{{ item }}"
  loop: "{{ python_tools_pipx }}"
  when: item not in (python_pipx_installed_names | default([]))
  register: python_pipx_global_install
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - python
    - packages
    - pipx

- name: Upgrade already installed global pipx tools
  ansible.builtin.command: pipx upgrade "{{ item }}"
  loop: "{{ python_tools_pipx }}"
  when: item in (python_pipx_installed_names | default([]))
  changed_when: false
  failed_when: false
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin
  tags:
    - python
    - packages
    - pipx

- name: Ensure pipx global binary path is present system-wide
  ansible.builtin.lineinfile:
    path: /etc/profile.d/pipx.sh
    line: 'export PATH="/usr/local/bin:$PATH"'
    create: true
    mode: '0644'
    owner: root
    group: root
  tags:
    - python
    - packages
    - pipx

- name: Install Python packages (PIP in venv)
  ansible.builtin.pip:
    name: "{{ python_packages_pip }}"
    state: present
    virtualenv: /opt/python-venv
    virtualenv_command: python3 -m venv
  tags:
    - python
    - packages

- name: Verify Python installation
  ansible.builtin.command: python3 --version
  register: python_version
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - python
    - test

- name: Verify pipx PATH configurations exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/profile.d/pipx.sh
  register: python_pipx_path_configs
  tags:
    - python
    - test

- name: Verify pipx tools are accessible
  ansible.builtin.command: which {{ item }}
  loop: "{{ python_tools_pipx }}"
  register: python_pipx_tools
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - python
    - test

- name: Display Python version
  ansible.builtin.debug:
    msg:
      - "Python version: {{ python_version.stdout | default('(check mode)') }}"
      - "pre-commit accessible: {{ python_pipx_tools.results[0].rc == 0 }}"
      - "yamllint accessible: {{ python_pipx_tools.results[1].rc == 0 }}"
      - "pylint accessible: {{ python_pipx_tools.results[2].rc == 0 }}"
      - "black accessible: {{ python_pipx_tools.results[3].rc == 0 }}"
  tags:
    - python
    - test
