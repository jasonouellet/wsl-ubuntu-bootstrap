name: Release

on:
  workflow_run:
    workflows: [CI - Validate & Lint Code]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    name: Create Tag if CHANGELOG Valid
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check if CHANGELOG was modified
        id: changelog-check
        run: |
          # Get the last tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            # First release - accept
            echo "First release, checking CHANGELOG exists"
            if [ -f "CHANGELOG.md" ]; then
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "valid=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            # Check if CHANGELOG was modified since last tag
            if git diff "${LATEST_TAG}..HEAD" --name-only | grep -q "CHANGELOG.md"; then
              echo "CHANGELOG.md was modified"
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "CHANGELOG.md was NOT modified - skipping release"
              echo "valid=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Detect semantic bump type from commits
        id: bump-detection
        if: steps.changelog-check.outputs.valid == 'true'
        run: |
          set -euo pipefail

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log --format=%B ${RANGE})
          BUMP="patch"

          if echo "$COMMITS" | grep -Eq '(^|[[:space:]])feat(\([^)]*\))?!:' || \
             echo "$COMMITS" | grep -Eq 'BREAKING CHANGE:|BREAKING-CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eq '(^|[[:space:]])feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected semantic bump type: $BUMP (range: $RANGE)"
          echo "::notice title=Version bump detected::${BUMP}"

      - name: Calculate version with GitVersion
        id: gitversion
        if: steps.changelog-check.outputs.valid == 'true'
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/repo" \
            gittools/gitversion:5.12.0@sha256:81b786a6535aec22670e98d7539b64499ed31dc7d7d599d909c517d21428b559 \
            /repo /output json > gitversion.json

          VERSION=$(jq -r '.SemVer' gitversion.json)

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Unable to calculate version with GitVersion" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "GitVersion produced an unexpected SemVer value: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bump intent: ${{ steps.bump-detection.outputs.bump }}"
          echo "Calculated version: $VERSION"

      - name: Validate CHANGELOG section for calculated version
        id: changelog
        if: steps.gitversion.outputs.version != ''
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.SemVer' gitversion.json)
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Unable to read version from gitversion.json" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer extracted from gitversion.json: $VERSION" >&2
            exit 1
          fi

          SECTION=$(awk -v version="$VERSION" '
            BEGIN {
              heading_prefix = "## [" version "]"
            }
            index($0, heading_prefix) == 1 {found=1; next}
            /^## \[/ {if (found) exit}
            found {print}
          ' CHANGELOG.md | sed '/^$/d')

          if [ -z "$SECTION" ]; then
            echo "CHANGELOG section not found for calculated version: $VERSION" >&2
            echo "Expected heading: ## [$VERSION]" >&2
            exit 1
          fi

          {
            echo 'CHANGELOG_BODY<<EOF'
            echo "$SECTION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag-check
        if: steps.gitversion.outputs.version != ''
        run: |
          set -euo pipefail

          CALCULATED_VERSION=$(jq -r '.SemVer' gitversion.json)
          if [[ -z "$CALCULATED_VERSION" || "$CALCULATED_VERSION" == "null" ]]; then
            echo "Unable to read version from gitversion.json" >&2
            exit 1
          fi

          if [[ ! "$CALCULATED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer extracted from gitversion.json: $CALCULATED_VERSION" >&2
            exit 1
          fi

          TAG="v${CALCULATED_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || \
             git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists - skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag-check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.tag-check.outputs.tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Remote tag already exists, skipping push: $TAG"
            exit 0
          fi

          git tag "$TAG" HEAD

          if git push origin "$TAG"; then
            echo "Created and pushed tag: $TAG"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag was created by another run, continuing: $TAG"
          else
            echo "Failed to push tag for unexpected reason: $TAG" >&2
            exit 1
          fi

      - name: Check if GitHub release already exists
        id: release-exists
        if: steps.gitversion.outputs.version != ''
        env:
          RELEASE_TAG: ${{ steps.tag-check.outputs.tag }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPOSITORY/releases/tags/$RELEASE_TAG")

          if [ "$STATUS" = "200" ]; then
            echo "Release already exists for tag $RELEASE_TAG"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: steps.release-exists.outputs.exists == 'false' && steps.gitversion.outputs.version != ''
        with:
          tag_name: ${{ steps.tag-check.outputs.tag }}
          name: Release ${{ steps.gitversion.outputs.version }}
          draft: false
          prerelease: false
          body: ${{ steps.changelog.outputs.CHANGELOG_BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
