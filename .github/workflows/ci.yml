name: CI - Validate & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    name: Linting and Pre-commit
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect releasable commits and guard CHANGELOG
        run: |
          # Get commits with conventional commit format (feat:, fix:, BREAKING CHANGE:)
          COMMITS=$(git log --oneline --all -E \
            --grep="^feat(\([^)]*\))?:" --grep="^fix(\([^)]*\))?:" --grep="BREAKING CHANGE:" \
            2>/dev/null || true)

          if [ -z "$COMMITS" ]; then
            echo "No releasable commits found - skipping CHANGELOG check"
            exit 0
          fi

          # Check if CHANGELOG mentions "Unreleased" section
          if grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "✓ CHANGELOG has Unreleased section"
            exit 0
          elif grep -q "## \[.*\]" CHANGELOG.md; then
            echo "⚠ CHANGELOG exists but no Unreleased section found"
            echo "If you added feat: or fix: commits, please update CHANGELOG.md"
            exit 0
          else
            echo "✗ CHANGELOG.md not found or improperly formatted"
            exit 1
          fi

      - name: Set up Python for linting
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Ansible and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core>=2.16 ansible-lint

      - name: Run pre-commit hooks (all files)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Lint Ansible playbooks and roles (ansible-lint)
        run: |
          ansible-lint main.yml -v

      - name: Ansible syntax check (main playbook)
        run: |
          ansible-playbook main.yml --syntax-check

      - name: Playbook dry-run (local connection)
        run: |
          ansible-playbook main.yml --check -i localhost, --connection=local

      - name: Validate SonarCloud project version matches CHANGELOG
        run: |
          chmod +x .github/scripts/validate-sonar-version.sh
          .github/scripts/validate-sonar-version.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          languages: actions
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          output: ci-results
          upload: false

      - name: Upload CodeQL SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        if: always() && hashFiles('ci-results/codeql.sarif') != ''
        with:
          sarif_file: 'ci-results/codeql.sarif'
          category: 'codeql'

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        with:
          args: >
            -Dsonar.sarifReportPaths=ci-results
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Skip SonarCloud Scan when token is unavailable
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not configured for this workflow run."
          echo "Skipping SonarCloud scan (expected for forks or repos without the secret)."

      - name: Run Trivy vulnerability and secret scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'ci-results/trivy.sarif'
          scanners: 'vuln,secret,misconfig'
          skip-dirs: '.git,.github,node_modules,.ansible'

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        if: always() && hashFiles('ci-results/trivy.sarif') != ''
        with:
          sarif_file: 'ci-results/trivy.sarif'
          category: 'trivy'

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: '.'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: 'sbom'
          path: 'sbom.spdx.json'
          retention-days: 30
