name: CI - Validate & Lint Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    name: Linting and Pre-commit
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate CHANGELOG updates for releasable changes
        id: changelog-guard
        run: |
          set -euo pipefail

          # Use the relevant commit range for this workflow context.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              RANGE="${BEFORE}..${AFTER}"
            else
              RANGE="${AFTER}"
            fi
          fi

          # Detect releasable commits in range (feat/fix/breaking).
          COMMITS=$(git log --oneline -E \
            --grep="^feat(\([^)]*\))?!:" \
            --grep="^feat(\([^)]*\))?:" \
            --grep="^fix(\([^)]*\))?:" \
            --grep="BREAKING CHANGE:" \
            ${RANGE} 2>/dev/null || true)

          if [ -z "$COMMITS" ]; then
            echo "No releasable commits in ${RANGE}; CHANGELOG validation not required."
            echo "requires_update=false" >> "$GITHUB_OUTPUT"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Releasable commits found: require CHANGELOG.md changed in the same range.
          if git diff --name-only ${RANGE} | grep -q "^CHANGELOG\.md$"; then
            echo "CHANGELOG.md was updated for releasable changes."
            echo "requires_update=true" >> "$GITHUB_OUTPUT"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG.md was not updated for releasable changes."
            echo "requires_update=true" >> "$GITHUB_OUTPUT"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python for linting
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Ansible and lint dependencies
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          pip install --only-binary :all: "ansible-core==2.16.3" "ansible-lint==6.17.2"

      - name: Run pre-commit hooks (all files)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Lint Ansible playbooks and roles (ansible-lint)
        run: |
          ansible-lint main.yml -v

      - name: Ansible syntax check (main playbook)
        run: |
          ansible-playbook main.yml --syntax-check

      - name: Playbook dry-run (local connection)
        run: |
          ansible-playbook main.yml --check -i localhost, --connection=local

      - name: Ensure CI results directory exists
        run: mkdir -p ci-results

      - name: Run Trivy vulnerability and secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'ci-results/trivy.sarif'
          scanners: 'vuln,secret,misconfig'
          skip-dirs: '.git,.github,node_modules,.ansible'

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        if: always() && hashFiles('ci-results/trivy.sarif') != ''
        with:
          sarif_file: 'ci-results/trivy.sarif'
          category: 'trivy'

      - name: Upload Trivy SARIF as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('ci-results/trivy.sarif') != ''
        with:
          name: 'trivy-sarif'
          path: 'ci-results/trivy.sarif'
          retention-days: 7

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: '.'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: 'sbom'
          path: 'sbom.spdx.json'
          retention-days: 30

      - name: Warn when releasable changes miss CHANGELOG update
        if: >-
          always() &&
          steps.changelog-guard.outputs.requires_update == 'true' &&
          steps.changelog-guard.outputs.updated == 'false'
        run: |
          echo "::warning title=CHANGELOG not updated::Releasable commit(s) detected"
          echo "but CHANGELOG.md was not modified in this change set."
          echo "This warning is non-blocking."

  codeql-analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          languages: actions
          build-mode: none

      - name: Ensure CI results directory exists
        run: mkdir -p ci-results

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          output: ci-results
          upload: false

      - name: Normalize CodeQL SARIF output filename
        run: |
          FIRST_SARIF="$(find ci-results -maxdepth 1 -type f -name '*.sarif' | head -n 1)"

          if [ -n "$FIRST_SARIF" ] && [ "$FIRST_SARIF" != "ci-results/codeql.sarif" ]; then
            cp "$FIRST_SARIF" ci-results/codeql.sarif
          fi

      - name: Upload CodeQL SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        if: always() && hashFiles('ci-results/codeql.sarif') != ''
        with:
          sarif_file: 'ci-results/codeql.sarif'
          category: '/language:actions'

      - name: Upload CodeQL SARIF as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('ci-results/codeql.sarif') != ''
        with:
          name: 'codeql-sarif'
          path: 'ci-results/codeql.sarif'
          retention-days: 7

  sonar-analyze:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs:
      - lint-and-validate
      - codeql-analyze
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Ensure CI results directory exists
        run: mkdir -p ci-results

      - name: Download Trivy SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 'trivy-sarif'
          path: 'ci-results'

      - name: Download CodeQL SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: 'codeql-sarif'
          path: 'ci-results'

      - name: Build SARIF import list for SonarCloud
        run: |
          SARIF_PATHS=""

          if [ -f ci-results/trivy.sarif ]; then
            SARIF_PATHS="ci-results/trivy.sarif"
          fi

          if [ -f ci-results/codeql.sarif ]; then
            if [ -n "$SARIF_PATHS" ]; then
              SARIF_PATHS="$SARIF_PATHS,ci-results/codeql.sarif"
            else
              SARIF_PATHS="ci-results/codeql.sarif"
            fi
          fi

          echo "SONAR_SARIF_PATHS=$SARIF_PATHS" >> "$GITHUB_ENV"

      - name: Resolve project version from latest tag
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"

          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi

          echo "SONAR_PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build SonarCloud args
        run: |
          ARGS="-Dsonar.projectVersion=${SONAR_PROJECT_VERSION}"

          if [ -n "${SONAR_SARIF_PATHS}" ]; then
            ARGS="$ARGS -Dsonar.sarifReportPaths=${SONAR_SARIF_PATHS}"
          fi

          echo "SONAR_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Run SonarCloud scan with SARIF imports
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        with:
          args: ${{ env.SONAR_ARGS }}

      - name: Skip SonarCloud scan when token is unavailable
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not configured for this workflow run."
          echo "Skipping SonarCloud scan (expected for forks or repos without the secret)."

  renovate-validate:
    name: Renovate Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure CI results directory exists
        run: mkdir -p ci-results

      - name: Run Renovate local validation (dry-run)
        env:
          LOG_LEVEL: debug
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            -e LOG_LEVEL \
            -e GITHUB_COM_TOKEN \
            ghcr.io/renovatebot/renovate@sha256:00185c0d63462acec8331cc9a94dcd74a763f2765fca0edcc3ff568af1dc8104 \
            renovate \
            --platform=local \
            --dry-run=full \
            --print-config=true \
            --config-file-names=.renovaterc.json \
            > ci-results/renovate-local.log 2>&1

      - name: Build Renovate markdown summary
        id: renovate-summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          log_path = Path('ci-results/renovate-local.log')
          text = log_path.read_text(encoding='utf-8', errors='replace')

          invalid_config = 'Repository has invalid config' in text
          dep_extract = 'Dependency extraction complete' in text

          regex_file_count = '-'
          regex_dep_count = '-'
          m = re.search(r'"regex": \{"fileCount":\s*(\d+),\s*"depCount":\s*(\d+)\}', text)
          if m:
              regex_file_count, regex_dep_count = m.group(1), m.group(2)

          flattened = '-'
          for line in text.splitlines():
              if 'flattened updates found' in line:
                  flattened = line.split('flattened updates found:')[-1].strip()
                  break

          skip_reasons = re.findall(r'"skipReason": "([^"]+)"', text)
          skip_counts = {}
          for reason in skip_reasons:
              skip_counts[reason] = skip_counts.get(reason, 0) + 1
          if skip_counts:
              skip_summary = ', '.join(f'{k}={v}' for k, v in sorted(skip_counts.items()))
          else:
              skip_summary = 'none'

          summary = [
              '<!-- renovate-validation-summary -->',
              '## Renovate Validation Summary',
              '',
              '| Check | Value |',
              '|---|---|',
              f'| Config valid | {"yes" if not invalid_config else "no"} |',
              f'| Dependency extraction | {"yes" if dep_extract else "no"} |',
              f'| Regex file count | {regex_file_count} |',
              f'| Regex dependency count | {regex_dep_count} |',
              f'| Skip reasons | {skip_summary} |',
              '',
              '### Detected updates (flattened)',
              '',
              f'{flattened}',
              '',
              '_Generated by CI job `renovate-validate`._',
          ]

          md = '\n'.join(summary) + '\n'
          Path('ci-results/renovate-summary.md').write_text(md, encoding='utf-8')
          print(md)

          if invalid_config:
              raise SystemExit(1)
          PY

      - name: Publish summary table in workflow summary
        run: cat ci-results/renovate-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Renovate validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: 'renovate-validation'
          path: |
            ci-results/renovate-local.log
            ci-results/renovate-summary.md
          retention-days: 14

      - name: Comment summary on pull request
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          jq -Rs '{body: .}' ci-results/renovate-summary.md > ci-results/renovate-summary-comment.json

          COMMENT_FILTER='.[] | select(.user.login=="github-actions[bot]")'
          COMMENT_FILTER+=" | select(.body | contains(\"<!-- renovate-validation-summary -->\"))"
          COMMENT_FILTER+=" | .id"
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "$COMMENT_FILTER" | tail -n1 || true)

          if [ -n "${COMMENT_ID:-}" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              --method PATCH \
              --input ci-results/renovate-summary-comment.json
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --method POST \
              --input ci-results/renovate-summary-comment.json
          fi
