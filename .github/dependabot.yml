version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: /
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: /
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "deps"
      include: scope
